<!DOCTYPE html>
<!-- Página única de SIRAI con lang="es" para que el lector hable español -->
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <!-- Viewport sin maximum-scale para que el zoom siga funcionando -->
        <meta
            name="viewport"
            content="minimum-scale=1, initial-scale=1, width=device-width, shrink-to-fit=no"
        />
        <meta name="theme-color" content="#8b1a1a" />
        <link rel="manifest" href="./manifest.json" />
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <link rel="icon" type="image/png" href="./favicon.png" />
        <!-- Título mientras carga la app y luego cada pantalla pone el suyo -->
        <title>SIRAI</title>
        <style>
            /* prefers-reduced-motion apaga animaciones y transiciones si el sistema lo pide */
            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after {
                    animation-duration: 0.01ms !important;
                    animation-iteration-count: 1 !important;
                    transition-duration: 0.01ms !important;
                    scroll-behavior: auto !important;
                }
            }

            /* :focus-visible con contorno negro y sombra blanca para ver siempre el foco */
            :focus-visible {
                outline: 3px solid #000000 !important;
                outline-offset: 0 !important;
                box-shadow: 0 0 0 6px #ffffff !important;
            }

            /* Spinner en CSS mientras carga el JavaScript tomado de projects.lukehaas.me/css-loaders */
            .loader-container {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                background-color: #fafafa;
            }


            .loader,
            .loader:before,
            .loader:after {
                border-radius: 50%;
            }

            .loader {
                color: #8b1a1a;
                font-size: 11px;
                text-indent: -99999em;
                margin: 55px auto;
                position: relative;
                width: 10em;
                height: 10em;
                box-shadow: inset 0 0 0 1em;
                -webkit-transform: translateZ(0);
                -ms-transform: translateZ(0);
                transform: translateZ(0);
            }

            .loader:before,
            .loader:after {
                position: absolute;
                content: '';
            }

            .loader:before {
                width: 5.2em;
                height: 10.2em;
                background: #fafafa;
                border-radius: 10.2em 0 0 10.2em;
                top: -0.1em;
                left: -0.1em;
                -webkit-transform-origin: 5.2em 5.1em;
                transform-origin: 5.2em 5.1em;
                -webkit-animation: load2 2s infinite ease 1.5s;
                animation: load2 2s infinite ease 1.5s;
            }

            .loader:after {
                width: 5.2em;
                height: 10.2em;
                background: #fafafa;
                border-radius: 0 10.2em 10.2em 0;
                top: -0.1em;
                left: 5.1em;
                -webkit-transform-origin: 0px 5.1em;
                transform-origin: 0px 5.1em;
                -webkit-animation: load2 2s infinite ease;
                animation: load2 2s infinite ease;
            }

            @-webkit-keyframes load2 {
                0% {
                    -webkit-transform: rotate(0deg);
                    transform: rotate(0deg);
                }
                100% {
                    -webkit-transform: rotate(360deg);
                    transform: rotate(360deg);
                }
            }

            @keyframes load2 {
                0% {
                    -webkit-transform: rotate(0deg);
                    transform: rotate(0deg);
                }
                100% {
                    -webkit-transform: rotate(360deg);
                    transform: rotate(360deg);
                }
            }
        </style>
        <!-- Fuente Roboto de Google Fonts con preconnect porque MUI la usa -->
        <link rel="preconnect" href="https://fonts.gstatic.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
            rel="stylesheet"
        />
    </head>

    <body>
        <noscript>Necesitas activar JavaScript para usar SIRAI.</noscript>
        <!-- Contenedor #root de React que comunes.tsx vuelve inert con un diálogo abierto -->
        <div id="root">
            <div class="loader-container">
                <div class="loader">Cargando…</div>
            </div>
        </div>
    </body>
    <!-- Script type="module" con el que Vite carga src/index.tsx -->
    <script type="module" src="/src/index.tsx"></script>
</html>
